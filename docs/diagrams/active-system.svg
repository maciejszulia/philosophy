<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 252" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="Układ aktywny żyje w obrocie między stanem niespokoju a stanem spokoju. Wola otwiera problem, uwaga zamyka problem, odpowiedzialność zaczyna nowy obrót.">
